name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

# The trigger carries no filter on what changed. The job `changes` decides whether a
# change touches anything but documentation, the build and test jobs read its answer,
# and the job `gate` reports on every pull request. `CI gate` is the check for branch
# protection to require, and a required check that a filter skipped would never report.

# A pull request's runs replace one another. A push keeps a run of its own, named by
# its commit, so that a later push never cancels the one run of the tree a merge made.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAKEFLAGS: -j4

jobs:
  # ============================================
  # What the change touches
  # ============================================
  changes:
    name: Changes
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2  # a pull request's merge commit and its first parent, the base
          persist-credentials: false
      - name: The scripts and the shape of this workflow
        run: |
          python3 .github/scripts/ci-selftest.py
          sh src/test/run_unit_cases_selftest.sh
          sh src/test/fuzz/run_seed_corpus_selftest.sh
      - name: Does the change touch anything but documentation
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request is checked out as its merge commit, whose first parent is the
          # base. A push names the commit before it. With no commit to compare against
          # the list is empty, ci-changes.py answers true and every job runs.
          base=""
          if [ "$EVENT" = "pull_request" ]; then
            base=$(git rev-parse --verify --quiet 'HEAD^1' || true)
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git fetch --no-tags --depth=1 origin "$BEFORE"; then base="$BEFORE"; fi
          fi
          files=""
          if [ -n "$base" ]; then
            # A comparison that fails gives no list, and no list means every job runs.
            if ! files=$(git diff --name-only --no-renames "$base" HEAD); then files=""; fi
          fi
          answer=$(printf '%s\n' "$files" | python3 .github/scripts/ci-changes.py)
          echo "$answer"
          echo "$answer" >> "$GITHUB_OUTPUT"

  # ============================================
  # Lint
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2  # need HEAD~1 for the changed-lines diff (default checkout is shallow)
      - name: Trailing whitespace (changed lines)
        run: |
          # HEAD~1 is absent on the very first commit / some events — don't hard-fail (exit 128).
          if git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            git diff --check HEAD~1 HEAD -- ':!src/leveldb' ':!src/univalue' ':!src/secp256k1'
          else
            echo "no previous commit to diff against — skipping whitespace check"
          fi
      - name: Python functional tests must compile
        run: |
          python3 -m py_compile qa/rpc-tests/*.py qa/pull-tester/*.py
      - name: Shell scripts pass shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # Soqucoin-authored scripts only; vendored/autotools excluded.
          shellcheck -S error contrib/devtools/check-crypto-licenses.sh

  # ============================================
  # Linux x86_64 (primary build + tests)
  # ============================================
  build-linux-x64:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake \
            pkg-config bsdmainutils python3 libssl-dev \
            libevent-dev libboost-all-dev libminiupnpc-dev \
            libzmq3-dev libsqlite3-dev libdb++-dev ccache \
            python3-zmq curl python3-pip python3-setuptools python3-dev
          # ltc_scrypt (Litecoin scrypt hasher) — required by qa/rpc-tests auxpow.py.
          # Use the repo's sanctioned installer: pulls ltc-scrypt v1.0.1 from the
          # Dogecoin upstream (sha256-checked) and pip-installs it. See qa/README.md.
          ./qa/pull-tester/install-deps.sh

      - name: CCache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: linux-x64-ccache-${{ hashFiles('**/configure.ac') }}
          restore-keys: linux-x64-ccache-

      - name: Build (with unit + bench tests enabled)
        run: |
          ./autogen.sh
          ./configure --without-gui \
            --enable-zmq --enable-module-rangeproof \
            --enable-module-generator --enable-experimental
          make $MAKEFLAGS

      - name: Run unit tests (make check)
        run: |
          make check VERBOSE=1

      - name: Run functional tests (Soqucoin-specific)
        run: |
          python3 qa/pull-tester/rpc-tests.py \
            auxpow.py latticefold_basic.py pat_basic.py unspendable-outputs.py \
            witness-prune-serving.py witness-prune-ibd.py \
            wallet-encryption.py pq-address-rpcs.py pq-wallet-key-handling.py \
            block1-time-gate.py chainid-required-height.py block-version-mark.py \
            activation-heights.py \
            fixed-seed-fallback.py maxconnections-addnode.py \
            p2p-socket-exception.py

  # ============================================
  # Linux ARM64 (cross-compile)
  # ============================================
  build-linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set up ARM64 multiarch
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ jammy main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          sudo apt-get update

      - name: Install build tools
        run: |
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake \
            pkg-config bsdmainutils python3 \
            g++-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Install ARM64 libraries
        run: |
          sudo apt-get install -y \
            libssl-dev:arm64 \
            libevent-dev:arm64 \
            libboost-system-dev:arm64 \
            libboost-filesystem-dev:arm64 \
            libboost-thread-dev:arm64 \
            libboost-chrono-dev:arm64 \
            libboost-program-options-dev:arm64 \
            libdb++-dev:arm64

      - name: Build (cross-compile)
        run: |
          ./autogen.sh
          ./configure --without-gui --disable-tests --disable-bench --disable-wallet \
            --disable-zmq --without-miniupnpc \
            --host=aarch64-linux-gnu \
            --with-boost-libdir=/usr/lib/aarch64-linux-gnu \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            AR=aarch64-linux-gnu-ar \
            RANLIB=aarch64-linux-gnu-ranlib \
            STRIP=aarch64-linux-gnu-strip \
            PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig \
            PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig \
            CPPFLAGS="-I/usr/aarch64-linux-gnu/include" \
            LDFLAGS="-L/usr/aarch64-linux-gnu/lib"
          make $MAKEFLAGS

      - name: Verify binary architecture
        run: |
          file src/.libs/soqucoind 2>/dev/null | grep -q "aarch64" && echo "✅ soqucoind is ARM64" || \
          file src/soqucoind | grep -q "aarch64" && echo "✅ soqucoind is ARM64" || (echo "❌ Wrong architecture" && exit 1)

  # ============================================
  # Windows x64 (cross-compile from Linux)
  # ============================================
  build-windows-x64:
    name: Windows x64
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake \
            pkg-config bsdmainutils python3 \
            g++-mingw-w64-x86-64 mingw-w64-x86-64-dev curl

      - name: Set mingw-w64 to POSIX threading
        run: |
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      # Without this cache every run rebuilds the whole mingw depends tree from
      # source, which makes job duration hostage to upstream mirror weather
      # (measured: 5m46s vs 1h15m on identical inputs, bead
      # ci-windows-depends-cache-76ug). depends/ keys each package build on a
      # recursive hash of its recipe, patches and toolchain, so a stale restore
      # is safe: changed packages rebuild, unchanged ones are reused, and
      # cached sources avoid the upstream fetch either way.
      #
      # The key must rotate whenever the package build ids can: actions/cache
      # never saves on an exact-key hit, so any build-id input missing from the
      # key degrades to rebuild-every-run-with-no-save. Build ids hash the
      # meta_depends files (depends/Makefile:111 — Makefile, funcs.mk, hosts/*,
      # builders/*) and the toolchain's --version output (depends/Makefile:79).
      # The toolchain half can change with no repo diff (apt installs the
      # current mingw each run), so it enters the key as a fingerprint step.
      - name: Toolchain fingerprint for the depends cache key
        id: toolchain
        run: |
          echo "hash=$( (x86_64-w64-mingw32-g++ --version; x86_64-w64-mingw32-ar --version; g++ --version) | sha256sum | cut -c1-12 )" >> "$GITHUB_OUTPUT"

      - name: Depends cache
        uses: actions/cache@v5
        with:
          path: |
            depends/built
            depends/sources
          key: windows-x64-depends-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('depends/packages/**', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/**', 'depends/builders/**') }}
          restore-keys: |
            windows-x64-depends-${{ steps.toolchain.outputs.hash }}-
            windows-x64-depends-

      - name: Build depends
        run: |
          make -j4 -C depends HOST=x86_64-w64-mingw32 NO_QT=1

      - name: Build
        run: |
          ./autogen.sh
          CONFIG_SITE=$PWD/depends/x86_64-w64-mingw32/share/config.site \
            ./configure --prefix=/ --without-gui --disable-tests --disable-bench
          make $MAKEFLAGS

  # ============================================
  # macOS ARM64 (native Apple Silicon)
  # ============================================
  build-macos-arm64:
    name: macOS ARM64
    runs-on: macos-15
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install automake libtool boost miniupnpc openssl@3 pkg-config libevent zeromq

      - name: Build
        env:
          BOOST_ROOT: /opt/homebrew
        run: |
          ./autogen.sh
          ./configure --without-gui --disable-tests --disable-bench --disable-wallet \
            --with-boost=/opt/homebrew \
            LDFLAGS="-L/opt/homebrew/lib -L/opt/homebrew/opt/openssl@3/lib -L/opt/homebrew/opt/libevent/lib" \
            CPPFLAGS="-I/opt/homebrew/include -I/opt/homebrew/opt/openssl@3/include -I/opt/homebrew/opt/libevent/include"
          make $MAKEFLAGS

  # ============================================
  # Linux x86_64 under the address and undefined-behaviour sanitizers
  # ============================================
  sanitizers:
    name: Sanitizers (address, undefined)
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 150
    env:
      # Leak detection is a separate set of reports and is off until they are read.
      ASAN_OPTIONS: detect_leaks=0
      # The undefined-behaviour sanitizer prints a report and carries on by default.
      # halt_on_error ends the process with a failure at a report. The suppressions
      # file lists the known sites, one line each.
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:suppressions=${{ github.workspace }}/src/test/sanitizer_suppressions/ubsan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake \
            pkg-config bsdmainutils python3 libssl-dev \
            libevent-dev libboost-all-dev libminiupnpc-dev \
            libzmq3-dev libsqlite3-dev libdb++-dev ccache \
            clang llvm

      - name: CCache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ccache
          key: linux-x64-sanitizers-ccache-${{ hashFiles('**/configure.ac') }}
          restore-keys: linux-x64-sanitizers-ccache-

      - name: Build with clang and both sanitizers
        run: |
          ./autogen.sh
          SAN="-g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer"
          # --disable-hardening: _FORTIFY_SOURCE is not supported with the address sanitizer.
          ./configure --without-gui --disable-hardening \
            --enable-zmq --enable-module-rangeproof \
            --enable-module-generator --enable-experimental \
            CC=clang CXX=clang++ \
            CFLAGS="$SAN" CXXFLAGS="$SAN" LDFLAGS="-fsanitize=address,undefined"
          make $MAKEFLAGS

      - name: The binaries under test carry both sanitizers
        run: |
          # A build that lost its flags would pass every step below with nothing to report.
          # A program built with the address sanitizer prints that sanitizer's flags when
          # asked to, through a libtool wrapper too. The undefined-behaviour runtime gives
          # no such answer inside the address sanitizer's, so its handlers are looked for
          # in the program file, or in the file a libtool wrapper starts.
          check() {
            bin="$1"; shift
            if ! ASAN_OPTIONS=help=1 "$bin" "$@" 2>&1 | grep -q 'Available flags for AddressSanitizer'; then
              echo "::error::$bin does not answer as a program built with the address sanitizer"; exit 1
            fi
            real="$bin"
            if [ -f "$(dirname "$bin")/.libs/$(basename "$bin")" ]; then real="$(dirname "$bin")/.libs/$(basename "$bin")"; fi
            if ! nm "$real" 2>/dev/null | grep -q '__ubsan_handle'; then
              echo "::error::$real carries no undefined-behaviour handler, so $bin is not instrumented"; exit 1
            fi
            echo "$bin: instrumented ($real)"
          }
          check src/test/test_soqucoin --list_content
          check src/test/fuzz/fuzz --list

      - name: Unit suite, one case per process
        run: |
          cd src
          test/run_unit_cases.sh -j 4 -o "$RUNNER_TEMP/unit-cases"

      - name: Fuzz seed pass
        run: |
          cd src
          test/fuzz/run_seed_corpus.sh

      - name: Keep the output of each case when the run fails or is cut short
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitizer-unit-cases
          path: ${{ runner.temp }}/unit-cases
          retention-days: 14

  # ============================================
  # One check that reports for every job above
  # ============================================
  gate:
    name: CI gate
    runs-on: ubuntu-22.04
    if: always()
    needs: [changes, lint, build-linux-x64, build-linux-arm64, build-windows-x64, build-macos-arm64, sanitizers]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every job passed, or the change is documentation alone
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci-gate.py
