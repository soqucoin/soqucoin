name: Register cross-run

# The register checker a pull request ships, run against the corpus on the pull request's
# base, so the check covers the checker as well as the text: a pull request that weakens a
# pattern fails a fixture the base pins.
#
# This job is advisory and is never made required. It runs on `pull_request`, so its own
# definition comes from the merge ref and the pull request can edit it, and the step below
# deliberately executes a file from the head. Both are acceptable for a job nothing is gated
# on. The required job is in register.yml: it loads its definition and its scripts from the
# default branch and runs no code from the pull request.
on:
  pull_request:
    types: [opened, reopened, synchronize]

# The step executes a file the pull request ships. `pull_request` is the trigger, so a fork
# run gets no secrets beyond the token itself; a same-repository branch gets them all. What
# keeps the token harmless either way is this block rather than the trigger. The step is given
# no token of its own.
permissions:
  contents: read

jobs:
  crossrun:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The corpus comes from the BASE of the pull request. On a pull_request event
      # actions/checkout defaults to the merge ref, which would run the copy of the corpus the
      # pull request itself ships against the checker it ships, and a pull request that
      # weakened both would pass.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      # The corpus resolves the checker from its own directory, so the mechanism is to place
      # the base corpus and the head checker together. The directory is created here, and the
      # checker has to be a plain file inside the head's own tree, so that what runs is what
      # the pull request ships.
      #
      # What the corpus requires of a checker is fixed by the base rather than by the pull
      # request: every pattern pinned by a fixture, which
      # .github/scripts/register-pin-selftest.py keeps true, and main() driven on each event
      # the checker branches on. Coverage is recorded as fixtures rather than as claims here:
      # register-lint-selftest.py, register-pin-selftest.py, and
      # register-crossrun-selftest.py, which reads the block below out of this file and runs
      # it. Scope and open items are in the tracker.
      #
      # Tightening a pattern so that it reclassifies an existing positive fixture takes two
      # merges, because the corpus that runs here is the base's.
      #
      # The body of this step is the step. A new file beside it would not do: this job checks
      # out the base, and the base of the change that adds such a file does not carry it, so
      # the step would fail on its own run. The workflow definition comes from the merge ref,
      # so what is written here is available the first time it runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - name: The base corpus against this pull request's checker
        run: |
          # Code from the pull request runs in this step, so it runs with no credential in
          # reach. A run step is handed no GITHUB_TOKEN unless the workflow puts one in its
          # environment, and this step puts none there; the check below is against a later
          # edit that adds one, and it fails closed rather than running head code beside a
          # token. The runner does inject a token of its own for the cache and artifact
          # services, and that one is dropped from the child process further down.
          if [ -n "${GITHUB_TOKEN:-}" ] || [ -n "${GH_TOKEN:-}" ]; then
            echo "::error title=Register cross-run::this step has a token in its environment and it runs code the pull request ships, so it fails closed. A token belongs to the required job in register.yml, which runs no head code."
            exit 1
          fi
          if [ ! -f .github/scripts/register-lint-selftest.py ]; then
            echo "::error title=Register cross-run::the base of this pull request carries no register corpus, so there is nothing to run the checker against, and this fails closed. Expected only for the change that installs the checker."
            exit 1
          fi
          checker=head/.github/scripts/register-lint.py
          if [ ! -f "$checker" ]; then
            echo "::error title=Register cross-run::this pull request removes or renames the register checker, so the base corpus has nothing to run against, and this fails closed."
            exit 1
          fi
          # `test -f` follows links, and so does `cp`. A checker that is a link, or that sits
          # under a linked directory, can resolve to the base's own trusted copy, and the run
          # would then judge a file this pull request does not ship. `pwd -P` resolves the
          # directory, and `-L` covers the file itself.
          head_real=$(cd head && pwd -P)
          checker_dir=$(cd "$(dirname "$checker")" && pwd -P)
          case "$checker_dir/" in
            "$head_real"/*) ;;
            *) echo "::error title=Register cross-run::the register checker in this pull request resolves outside the pull request's own tree, so running it would judge a file the pull request does not ship, and this fails closed."
               exit 1 ;;
          esac
          if [ -L "$checker" ]; then
            echo "::error title=Register cross-run::the register checker in this pull request is a link rather than a file, so what runs is not what the pull request ships, and this fails closed."
            exit 1
          fi
          # The directory is made here rather than in the head's tree. A head that chose the
          # destination could make the corpus path a symlink to /dev/null, take the write, and
          # leave an empty file to run.
          work="$RUNNER_TEMP/crossrun"
          mkdir "$work"
          cp "$checker" "$work/"
          cp .github/scripts/register-lint-selftest.py "$work/"
          # The runner's own tokens for the cache, artifact and id-token services are in the
          # environment of every step. They are not the repository token and cannot read the
          # repository, and the process about to run is the pull request's, so they go.
          if ! env -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              python3 "$work/register-lint-selftest.py" > "$work/out" 2>&1; then
            cat "$work/out"
            echo "::error title=Register cross-run::the base corpus does not behave against the checker this pull request ships."
            exit 1
          fi
          cat "$work/out"
          # An exit status on its own is not a result. A run that reached no verdict line did
          # not get to the end of the corpus, and its zero says nothing about the checker. The
          # two counts have to agree as well: the corpus prints its tally before it exits, so
          # a checker that neutralises the exit leaves an honest tally behind a clean status.
          if ! awk -F'[/ ]' '/ fixtures behave$/ && $1 == $2 { found = 1 }
                             END { exit !found }' "$work/out"; then
            echo "::error title=Register cross-run::the base corpus reached no verdict, so its exit status says nothing about the checker this pull request ships."
            exit 1
          fi
